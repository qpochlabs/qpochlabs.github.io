title: Hari Prasad - Blog
author: Hari Prasad
description: "Blog posts by Hari Prasad on AI research — perception, planning, sim2real and novel view synthesis."
url: "https://qpochlabs.github.io"
baseurl: ""

permalink: /blog/:title/

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
